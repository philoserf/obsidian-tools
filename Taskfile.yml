# Taskfile for Obsidian Tools
# See https://taskfile.dev for documentation
version: "3"

vars:
  BUILD_DIR: ./validate-plugin-manifest
  BINARY_NAME: obsidian-validate-plugin-manifest

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  build:
    desc: Build the validator binary
    cmds:
      - go build -o {{.BINARY_NAME}} {{.BUILD_DIR}}
    sources:
      - "{{.BUILD_DIR}}/**/*.go"
      - "go.mod"
    generates:
      - "{{.BINARY_NAME}}"

  test:
    desc: Run tests (extra flags via `--`, e.g. `task test -- -cover`)
    cmds:
      - go test {{.CLI_ARGS}} ./...

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run ./...

  fix:
    desc: Auto-fix lint and formatting issues (Go + Markdown)
    cmds:
      - golangci-lint run --fix ./...
      - gofumpt -l -w .
      - prettier --write "**/*.md"

  run:
    desc: Run the validator (extra flags via `--`, e.g. `task run -- --json`)
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}} {{.CLI_ARGS}}

  ci:
    desc: Run lint + tests (CI pipeline)
    cmds:
      - task: lint
      - task: test
